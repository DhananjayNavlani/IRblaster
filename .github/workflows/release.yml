name: Build and Release APK

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "release_tag=v${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: List APK output directory
        run: |
          echo "Listing all APK files in build directory:"
          find app/build -name "*.apk" -type f
          echo ""
          echo "Listing release APK directory contents:"
          ls -la app/build/outputs/apk/release/ || echo "Release directory not found"

      - name: Find and Rename APK
        id: apk
        run: |
          # Find the release APK file
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in release directory, searching in all build outputs..."
            APK_FILE=$(find app/build -name "*release*.apk" -type f | head -1)
          fi
          
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          
          # Copy to a known location with proper name
          cp "$APK_FILE" ./IRBlaster-v${{ steps.version.outputs.version_name }}.apk
          echo "apk_path=./IRBlaster-v${{ steps.version.outputs.version_name }}.apk" >> $GITHUB_OUTPUT
          ls -la ./IRBlaster-v${{ steps.version.outputs.version_name }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Release ${{ steps.version.outputs.version_name }}
          body: |
            ## IRBlaster v${{ steps.version.outputs.version_name }}
            
            **Version Code:** ${{ steps.version.outputs.version_code }}
            
            ### Changes
            - Auto-generated release from release branch
            
            ### Installation
            Download the APK file below and install it on your Android device.
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false

